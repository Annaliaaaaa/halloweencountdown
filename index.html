<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
</head>

<body>
    <script src="js/count.js"></script>
    <div class="container">
        <img src="img/download (3).png" alt="Happy Halloween">
        <div class="content">
            <p>Website is Under Maintenace</p>
            <h1>We're <span>launching</span> soon</h1>
            <div class="launch-time">
                <div>
                    <p id="days">
                        00
                    </p>
                    <span>
                        Days
                    </span>
                </div>
                <div id="hours">
                    <p>
                        00
                    </p>
                    <span>
                        Hours
                    </span>
                </div>
                <div id="minutes">
                    <p>
                        00
                    </p>
                    <span>
                        Minutes
                    </span>
                </div>

                <div id="seconds">
                    <p>
                        00
                    </p>
                    <span>
                        Seconds
                    </span>
                </div>
            </div>
        </div>
        <img src="img/download (1).png" class="h">
    </div>
    <script>
        var countDownDate = new Date("Oct 29, 2026 00:00:00").getTime();
        var x = setInterval(function () {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var minutes = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHtml = days;
            document.getElementById("hours").innerHtml = hours;
            document.getElementById("minutes").innerHtml = minutes;
            document.getElementById("seconds").innerHtml = seconds;

            if (distance < 0) {
                document.getElementById("days").innerHtml = "00";
                document.getElementById("hours").innerHtml = "00";
                document.getElementById("minutes").innerHtml = "00";
                document.getElementById("seconds").innerHtml = "00";
            }

        }, 1000);
    </script>
</body>

</html>
